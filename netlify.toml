[build]
command = "npm run prod"
publish = "build_production"

[build.environment]
PHP_VERSION = "8.3"
NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/studio"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Echo-era path (echocyber.io/infosecon2026) -> the Nightglass talk page.
[[redirects]]
  from = "/infosecon2026"
  to = "/infosecon"
  status = 301
  force = true

# The old preview hostname -> the real domain (launched 2026-10-14). Deploy previews use other hostnames, unaffected.
[[redirects]]
  from = "https://nightglassadvisory.netlify.app/*"
  to = "https://nightglassadvisory.com/:splat"
  status = 301
  force = true

# Podcast (Pulse) smart link, same target as echocyber.io/listen. Used in LinkedIn post footers (10/14).
[[redirects]]
  from = "/listen"
  to = "https://pod.link/1894903133"
  status = 301
  force = true

# Signal vs. Noise "full edition" link (Mike 2026-10-18: no more echocyber.io in copy).
# 302 on purpose: when Beehiiv moves to signal.nightglassadvisory.com, only this target changes.
[[redirects]]
  from = "/newsletter"
  to = "https://signal.echocyber.io"
  status = 302
  force = true
