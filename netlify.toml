[build]
command = "npm run prod"
publish = "build_production"

[build.environment]
PHP_VERSION = "8.3"
NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/studio"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Echo-era path (echocyber.io/infosecon2026) -> the Nightglass talk page.
[[redirects]]
  from = "/infosecon2026"
  to = "/infosecon"
  status = 301
  force = true
